<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <title>QA Session Replay (Timeline)</title>
    <style>
        body {
            font: 14px/1.5 system-ui, sans-serif;
            margin: 20px;
            color: #e5e7eb;
            background: #0f0f14;
        }

        .drop {
            border: 2px dashed #8b5cf6;
            padding: 24px;
            text-align: center;
            border-radius: 10px;
        }

        .list {
            margin-top: 20px;
            max-height: 70vh;
            overflow: auto;
        }

        .row {
            padding: 8px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .tag {
            font-size: 12px;
            padding: 2px 6px;
            border-radius: 6px;
            background: rgba(139, 92, 246, .2);
            color: #a78bfa;
            margin-right: 6px;
        }

        .muted {
            color: #9ca3af
        }
    </style>
</head>

<body>
    <h1>QA Session Replay (Timeline)</h1>
    <div class="drop" id="drop">Drop exported JSON here (or click)</div>
    <div class="list" id="list"></div>
    <script src="replay-viewer.js"></script>
</body>

</html>
